# uwsgi.ini 配置文件
# uwsgi --ini uwsgi.ini
# 方便部署用，开发无用
[uwsgi]

# Django 项目执行端口号
socket = :8000

# Django 项目根目录
chdir = /root/github/saolei_website/back_end/saolei

# Django 的wsgi文件
module = saolei.wsgi

# 允许主进程存在
master = true

# 最大进程数
processes = 5

# The global timer is independent of route/user timers, so it must allow MSGames to finish.
harakiri = 90
harakiri-verbose = true

# Internal routing requires PCRE support. Keep ordinary requests at 10s with a user timer;
# only the external-I/O operations below retain the global 90s budget:
#   MSGames sync/import, WOM sync (/accountlink/update/), staff account verification.
# "route" matches PATH_INFO, so query parameters do not affect this rule.
route = ^(?!/api/accountlink/msgames/([0-9]+/sync|videos/[0-9]+/import)$|/accountlink/update/$|/api/accountlink/verify/$) harakiri:10

# Keep the web process pool healthy during leaks or wedged requests.
max-requests = 1000
max-requests-delta = 100
listen = 128
die-on-term = true
need-app = true

# 当服务器退出时自动清理环境
vacuum = true

# 解决APScheduler任务不能执行
enable-threads = true
preload=True
