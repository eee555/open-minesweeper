# etc/nginx/conf.d

server {
    listen       80;
    # 修改1：
    # 配置为你自己服务器的ip地址
    server_name  openms.top;

    # 给acme放行
    location ~ "^/\.well-known/acme-challenge/([-_a-zA-Z0-9]+)$" {
      default_type text/plain;
      return 200 "xxx";
    }
    location  / {
      rewrite ^(.*)$ https://${server_name}$1 permanent;
    }

}

server {
    listen 443 ssl;
    server_name  openms.top;
    ssl_certificate     /etc/nginx/conf.d/cert.pem;
    ssl_certificate_key /etc/nginx/conf.d/key.pem;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # front_end/vite.config.ts uses Vite's default base "/".
    # Build assets are requested as /assets/..., and vite-plugin-compression
    # writes .gz files next to .js/.mjs/.json/.css/.html/.wasm in dist.
    gzip_static on;
    gzip_vary on;

    # Serve all Vite assets, including offline ZIP packages, without passing them to Django.
    location ^~ /assets/ {
        root /root/saolei/static;
        try_files $uri =404;
    }

    # VitePress 用户指南
    # 将 vitepress_doc/.vitepress/dist 的构建产物部署到 /root/saolei/docs/
    location = /docs {
        return 308 /docs/$is_args$args;
    }

    location ^~ /docs/ {
        alias /root/saolei/docs/;
        index index.html;
        try_files $uri $uri.html $uri/ /docs/index.html;
    }

    # APScheduler publishes this file every five minutes; requests never run collectors.
    location = /api/monitor/summary {
        alias /root/saolei/runtime/monitor.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        open_file_cache off;
        limit_req zone=general burst=5;
        error_page 404 =503 @monitor_unavailable;
    }

    location @monitor_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Monitor snapshot is not available yet."}';
    }

    location ^~ /api/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    # MSGames synchronously reads external histories and imports replay files.
    # Keep this above the uWSGI per-request 90s limit and below the client's 120s timeout.
    location ^~ /api/accountlink/msgames/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_connect_timeout 5s;
        uwsgi_read_timeout 95s;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    location ^~ /api/userprofile/info/ {
        limit_req zone=general burst=5;
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    location ^~ /api/userprofile/avatar/ {
        limit_req zone=general burst=5;
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    # Internal media target for X-Accel-Redirect responses.
    # Django resolves database ids to stored media paths; Nginx handles file lookup and transfer.
    location ^~ /internal-media/ {
        internal;
        alias /root/saolei/media/;
    }
	
	# 修改3：
	# 当访问路径为/static时Nginx将会自行处理
    # 这里的/root/saolei_static/static路径为静态资源存储地址
    # 注意：该路径与前面Django的settings.py文件里设置的一致
    location ^~ /static/ {
        expires 30d;
        autoindex on;
        add_header Cache-Control private;
        alias /root/saolei/static/;
    }

    # 下载阿比特和元扫雷等
    location /download {
        expires 30d;
        autoindex on;
        add_header Cache-Control private;
        alias /root/saolei/download;
    }

    # 确保把wasm当作静态资源
    location ~* \.(html|css|gif|ico|jpg|js|json|mjs|png|ttf|woff|wasm|svg)$ {
        root /root/saolei/static;
    }
}


