# etc/nginx/conf.d

# Match the original URI: $uri changes during X-Accel-Redirect.
# Keep this public API allowlist aligned with the actual application routes.
map $request_uri $openms_public_cors {
    default 0;
    ~^/api/userprofile/(?:avatar/[^?]*|identifier/?|info/[^?]*|infobulk/?|infoupdated/?|videolist/?)(?:\?.*)?$ 1;
    ~^/api/video/(?:download/[0-9]+/?|preview/?|infobulk/?|detailbulk/?|staticdetailbatch/?|abstractbulk/?)(?:\?.*)?$ 1;
}

map "$openms_public_cors:$request_method:$http_origin:$http_access_control_request_method" $openms_cors_origin {
    default "";
    ~^1:GET:.+:.*$ "*";
    ~^1:OPTIONS:.+:GET$ "*";
}

map "$openms_cors_origin:$request_method:$http_access_control_request_method" $openms_cors_preflight {
    default 0;
    ~^\*:OPTIONS:GET$ 1;
}

map $openms_cors_preflight $openms_cors_methods {
    default "";
    1 GET;
}

map $openms_cors_preflight $openms_cors_headers {
    default "";
    1 "accept, authorization, content-type, user-agent, x-csrftoken, x-requested-with";
}

map $openms_cors_preflight $openms_cors_max_age {
    default "";
    1 86400;
}

map "$openms_cors_origin:$request_uri" $openms_cors_expose {
    default "";
    ~^\*:/api/video/(?:download/[0-9]+/?|preview/?)(?:\?.*)?$ "Content-Disposition, X-Replay-Container-Version";
}

map $openms_public_cors $openms_cors_vary {
    default "";
    1 Origin;
}

server {
    listen       80;
    # 修改1：
    # 配置为你自己服务器的ip地址
    server_name  openms.top;

    # 给acme放行
    location ~ "^/\.well-known/acme-challenge/([-_a-zA-Z0-9]+)$" {
      default_type text/plain;
      return 200 "xxx";
    }
    location  / {
      rewrite ^(.*)$ https://${server_name}$1 permanent;
    }

}

server {
    listen 443 ssl;
    server_name  openms.top;
    ssl_certificate     /etc/nginx/conf.d/cert.pem;
    ssl_certificate_key /etc/nginx/conf.d/key.pem;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # Public APIs allow all origins without cross-origin credentials.
    # Internal media inherits these headers after X-Accel-Redirect.
    # Ignore upstream copies so old workers cannot duplicate gateway headers.
    uwsgi_hide_header Access-Control-Allow-Origin;
    uwsgi_hide_header Access-Control-Allow-Credentials;
    uwsgi_hide_header Access-Control-Allow-Methods;
    uwsgi_hide_header Access-Control-Allow-Headers;
    uwsgi_hide_header Access-Control-Max-Age;
    uwsgi_hide_header Access-Control-Expose-Headers;
    uwsgi_hide_header X-Replay-Container-Version;

    add_header Access-Control-Allow-Origin $openms_cors_origin always;
    add_header Access-Control-Allow-Methods $openms_cors_methods always;
    add_header Access-Control-Allow-Headers $openms_cors_headers always;
    add_header Access-Control-Max-Age $openms_cors_max_age always;
    add_header Access-Control-Expose-Headers $openms_cors_expose always;
    add_header Vary $openms_cors_vary always;
    add_header X-Replay-Container-Version $upstream_http_x_replay_container_version always;

    if ($openms_cors_preflight) {
        return 204;
    }

    # front_end/vite.config.ts uses Vite's default base "/".
    # Build assets are requested as /assets/..., and vite-plugin-compression
    # writes .gz files next to .js/.mjs/.json/.css/.html/.wasm in dist.
    gzip_static on;
    gzip_vary on;

    # Serve all Vite assets, including offline ZIP packages, without passing them to Django.
    location ^~ /assets/ {
        root /root/saolei/static;
        try_files $uri =404;
    }

    # VitePress 用户指南
    # 将 vitepress_doc/.vitepress/dist 的构建产物部署到 /root/saolei/docs/
    location = /docs {
        return 308 /docs/$is_args$args;
    }

    location ^~ /docs/ {
        alias /root/saolei/docs/;
        index index.html;
        try_files $uri $uri.html $uri/ /docs/index.html;
    }

    # APScheduler publishes this file every five minutes; requests never run collectors.
    location = /api/monitor/summary {
        alias /root/saolei/runtime/monitor.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        open_file_cache off;
        limit_req zone=general burst=5;
        error_page 404 =503 @monitor_unavailable;
    }

    location @monitor_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Monitor snapshot is not available yet."}';
    }

    location ^~ /api/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    # Replay parsing, pluck and compression run synchronously. Allow the
    # ordinary uWSGI 10s request budget to expire before the gateway timeout.
    location = /common/uploadvideo/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 12s;
    }

    location ^~ /api/common/admin/memorial/users/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 12s;
    }

    location ^~ /api/tournament/gsc/history/participants/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 12s;
    }

    # MSGames synchronously reads external histories and imports replay files.
    # Keep this above the uWSGI per-request 90s limit and below the client's 120s timeout.
    location ^~ /api/accountlink/msgames/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_connect_timeout 5s;
        uwsgi_read_timeout 95s;
    }

    # WOM sync calls an external read-only HTTP service synchronously: at most
    # 2 attempts x 6s + 2s backoff = 13s. Keep the gateway budget above that and
    # below the frontend's 20s, so the app can still answer with a JSON error.
    location = /accountlink/update/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_connect_timeout 5s;
        uwsgi_read_timeout 18s;
    }

    # Staff verification runs the same first sync.
    location = /api/accountlink/verify/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_connect_timeout 5s;
        uwsgi_read_timeout 18s;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    location ^~ /api/userprofile/info/ {
        limit_req zone=general burst=5;
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    location ^~ /api/userprofile/avatar/ {
        limit_req zone=general burst=5;
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    # Internal media target for X-Accel-Redirect responses.
    # Django resolves database ids to stored media paths; Nginx handles file lookup and transfer.
    location ^~ /internal-media/ {
        internal;
        alias /root/saolei/media/;
    }
	
	# 修改3：
	# 当访问路径为/static时Nginx将会自行处理
    # 这里的/root/saolei_static/static路径为静态资源存储地址
    # 注意：该路径与前面Django的settings.py文件里设置的一致
    location ^~ /static/ {
        expires 30d;
        autoindex on;
        add_header Cache-Control private;
        alias /root/saolei/static/;
    }

    # 下载阿比特和元扫雷等
    location /download {
        expires 30d;
        autoindex on;
        add_header Cache-Control private;
        alias /root/saolei/download;
    }

    # 确保把wasm当作静态资源
    location ~* \.(html|css|gif|ico|jpg|js|json|mjs|png|ttf|woff|wasm|svg)$ {
        root /root/saolei/static;
    }
}


