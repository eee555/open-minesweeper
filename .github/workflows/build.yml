name: Build and Deploy

on:
  push:
    #branches:
    #  - main
    #  - dev
    tags:
      - '*' # 监听所有的tag push事件

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 检出当前的代码仓库
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Download backend wheels
      working-directory: back_end/saolei
      run: |
        python -m pip download --no-deps --dest wheels -r requirements-wheels.txt
        sha256sum wheels/*.whl > wheels/SHA256SUMS

    # 安装 sshpass 工具，用于处理 SCP 密码认证
    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    # 设置 Node.js 版本
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # 安装依赖
    - name: Install dependencies
      run: |
        node -v
        npm -v
        cd front_end
        npm install
        npm update ms-toollib
        npm list

    # 运行构建命令
    - name: Build project 1
      run: |
        cd front_end
        python -m pip install Pillow
        python scripts/build_medal_art.py
        python -m unittest discover -s scripts -p test_medal_art.py
        npm run build:openms
        cd dist
        # 打包完后，克隆录像播放器并构建
        git clone https://github.com/eee555/flop-player.git flop
        cd flop
        npm install
        npm update ms-toollib
        npm run build
        mv dist ../temp_dist
        cd ..
        rm -rf flop
        mv temp_dist flop
        # 从gitee下载文章静态资源
        mkdir article
        cd article
        git clone https://gitee.com/ee55/saolei_website_article.git
        cp -r saolei_website_article/* ./
        ls
        rm -rf .git
        rm LICENSE
        rm -r saolei_website_article

    # 使用SCP或其他方式上传文件到远程服务器
    - name: Upload files to server 1
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }} # 服务器地址
        SERVER_USER: ${{ secrets.SERVER_USER }} # 服务器用户名
        SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }} # 服务器密码
        REMOTE_PATH: ${{ secrets.REMOTE_PATH }} # 远程路径，不保密
      run: |
        echo Uploading build files to server...
        cd front_end
        sshpass -p "${SERVER_PASSWORD}" scp -o StrictHostKeyChecking=no -r dist ../back_end/saolei/wheels ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/github/saolei_website/back_end/saolei
        sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /root/github/saolei_website/back_end/saolei && sha256sum -c wheels/SHA256SUMS"
        # Exact medal-only replacement: remove obsolete remote files after successful SCP.
        sshpass -p "${SERVER_PASSWORD}" ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd /root/github/saolei_website/back_end/saolei && find dist/assets/medals -type f ! -path 'dist/assets/medals/breakthrough-nf.webp' ! -path 'dist/assets/medals/breakthrough.webp' ! -path 'dist/assets/medals/difficulty/b.webp' ! -path 'dist/assets/medals/difficulty/e.webp' ! -path 'dist/assets/medals/difficulty/i.webp' ! -path 'dist/assets/medals/levels-nf.webp' ! -path 'dist/assets/medals/levels.webp' ! -path 'dist/assets/medals/mastery-nf.webp' ! -path 'dist/assets/medals/mastery.webp' ! -path 'dist/assets/medals/modes.webp' ! -path 'dist/assets/medals/precision-nf-three.webp' ! -path 'dist/assets/medals/precision-nf.webp' ! -path 'dist/assets/medals/precision-three.webp' ! -path 'dist/assets/medals/precision.webp' ! -path 'dist/assets/medals/registered.webp' ! -path 'dist/assets/medals/reviewed.webp' ! -path 'dist/assets/medals/saolei.webp' ! -path 'dist/assets/medals/shareholder.webp' ! -path 'dist/assets/medals/speed-nf.webp' ! -path 'dist/assets/medals/speed.webp' -delete"
