name: Cypress E2E Tests

on:
  pull_request:
    paths: 
      - 'front_end/**'
      - 'back_end/**'
      - '!front_end/src/**/*.cy.ts'
      - '!front_end/src/**/*.test.ts'
      - '!front_end/cypress/support/component.ts'
      - '.github/workflows/CypressE2E.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: saolei
          MYSQL_ROOT_PASSWORD: 123456
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
        ports:
          - 3306:3306
      redis:  # 添加 Redis 服务
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            back_end/saolei/requirements.txt
            back_end/saolei/requirements-wheels.txt

      - name: Install backend dependencies
        run: |
          cd back_end/saolei
          python -m pip download --no-deps --dest wheels -r requirements-wheels.txt
          pip install --find-links wheels -r requirements.txt
          
      - name: Create Logs Directory
        run: mkdir -p back_end/saolei/logs

      - name: Set up backend
        run: |
          cd back_end/saolei
          python manage.py makemigrations
          python manage.py migrate
          E2E_TEST=True python manage.py runserver 127.0.0.1:8000 --noreload > backend.log 2>&1 &
          echo "Backend started in background"

      - name: Install Chinese fonts
        run: sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk

      # The action installs dependencies once with npm ci and caches npm/Cypress.
      # Start Vite directly to skip predev's offline-package builds.
      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          start: npx vite --host 127.0.0.1 --port 8080 --strictPort
          working-directory: front_end
          browser: chrome
          wait-on: 'http://localhost:8000,http://localhost:8080'

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: front_end/cypress/screenshots
          if-no-files-found: ignore
          
      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: |
            back_end/saolei/backend.log
            back_end/saolei/logs
          if-no-files-found: ignore
